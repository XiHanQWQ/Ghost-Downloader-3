name: Test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libzstd1

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --locked

      - name: Run tests
        run: uv run pytest
